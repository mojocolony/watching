name: Watching tests

on:
  push:
    branches:
      - main
      - feature/set-aside-someday-synopses
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
